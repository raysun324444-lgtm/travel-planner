<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Travel Budget Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>VoyageBudget</h1>
            <p>Select your parameters to instantly simulate three tiers of travel pricing.</p>
        </header>

        <section class="form-section">
            <!-- Route -->
            <div class="input-group row">
                <div class="col">
                    <label for="origin">From</label>
                    <select id="origin">
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="TH">Thailand</option>
                        <option value="JP">Japan</option>
                        <option value="FR">France</option>
                    </select>
                </div>
                <div class="col">
                    <label for="destination">To</label>
                    <select id="destination">
                        <option value="TH" selected>Thailand</option>
                        <option value="JP">Japan</option>
                        <option value="FR">France</option>
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                    </select>
                </div>
            </div>

            <!-- Dates -->
            <div class="input-group row">
                <div class="col">
                    <label for="depart-date">Departure</label>
                    <input type="date" id="depart-date" value="2026-10-01">
                </div>
                <div class="col">
                    <label for="return-date">Return</label>
                    <input type="date" id="return-date" value="2026-10-10">
                </div>
            </div>

            <!-- Travelers -->
            <div class="input-group row">
                <div class="col counter-group">
                    <label>Adults</label>
                    <div class="counter">
                        <button type="button" onclick="changeCount('adults', -1)">-</button>
                        <span id="adults-count">1</span>
                        <button type="button" onclick="changeCount('adults', 1)">+</button>
                    </div>
                </div>
                <div class="col counter-group">
                    <label>Children</label>
                    <div class="counter">
                        <button type="button" onclick="changeCount('children', -1)">-</button>
                        <span id="children-count">0</span>
                        <button type="button" onclick="changeCount('children', 1)">+</button>
                    </div>
                </div>
            </div>

            <!-- Purpose -->
            <div class="input-group">
                <label>Trip Purpose</label>
                <div class="radio-toggle">
                    <label class="radio-label">
                        <input type="radio" name="purpose" value="pleasure" checked onchange="calculateBudget()">
                        <span>Pleasure</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="purpose" value="business" onchange="calculateBudget()">
                        <span>Business</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Results Matrix -->
        <section class="results-section">
            <div class="budget-card low">
                <h3>Economy</h3>
                <p class="subtitle">Hostels, local food, public transit</p>
                <div class="price" id="budget-low">$0</div>
            </div>
            <div class="budget-card mid active">
                <h3>Comfort</h3>
                <p class="subtitle">3-star hotels, cafes, casual rideshares</p>
                <div class="price" id="budget-mid">$0</div>
            </div>
            <div class="budget-card exclusive">
                <h3>Exclusive</h3>
                <p class="subtitle">Luxury resorts, fine dining, private cars</p>
                <div class="price" id="budget-exclusive">$0</div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
